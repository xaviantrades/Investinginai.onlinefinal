<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#030917">
  <title>Investment Transactions — AIVI AI</title>

  <link rel="stylesheet" href="wave-background.css">
  <style>
    .dashboard-card {
      width: 100%;
      background: var(--surface, rgba(9, 21, 40, 0.80));
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-radius: 18px;
      border: 1px solid rgba(37, 184, 255, 0.36);
      padding: 20px 16px;
      box-shadow: var(--shadow-card);
      position: relative;
    }

    .tab-toggle {
      display: flex;
      gap: 6px;
      background: rgba(3, 10, 22, 0.72);
      padding: 5px;
      border-radius: 12px;
      border: 1px solid rgba(37, 184, 255, 0.24);
      margin-bottom: 18px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      color: #8fa6c2;
      font-weight: 700;
      font-size: 13.5px;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #25b8ff 0%, #1685ff 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(22, 133, 255, 0.35);
    }

    .summary-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(3, 10, 22, 0.58);
      border: 1px solid rgba(37, 184, 255, 0.22);
      padding: 14px 16px;
      border-radius: 14px;
      margin-bottom: 16px;
      gap: 12px;
    }

    .summary-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .summary-item .label {
      font-size: 11px;
      font-weight: 700;
      color: #8fa6c2;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .summary-item .value {
      font-size: 16px;
      font-weight: 800;
      color: #ffffff;
    }

    .money-text {
      color: #00e676 !important;
    }

    .status-msg {
      padding: 16px;
      border-radius: 12px;
      font-size: 13.5px;
      text-align: center;
      margin-bottom: 12px;
    }

    .status-msg.error {
      background: rgba(239, 68, 68, 0.14);
      color: #ff7b7b;
      border: 1px solid rgba(239, 68, 68, 0.35);
    }

    .status-msg.info {
      background: rgba(37, 184, 255, 0.08);
      color: #9bb3cf;
      border: 1px solid rgba(37, 184, 255, 0.22);
    }

    #no-investments-message,
    #error-message {
      display: none;
    }

    .investments-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 80px;
    }

    .investment-card,
    .tx-item {
      width: 100%;
      background: rgba(3, 10, 22, 0.62);
      border: 1px solid rgba(37, 184, 255, 0.28);
      border-radius: 14px;
      padding: 16px;
    }

    .investment-card[hidden] {
      display: none !important;
    }

    .investment-card .investment-title {
      font-size: 15px;
      font-weight: 800;
      margin: 0 0 10px;
      color: #25b8ff;
    }

    .investment-card .investment-info {
      font-size: 13px;
      color: #b4cae3;
      margin: 5px 0;
      line-height: 1.45;
    }

    .investment-card .investment-price,
    .investment-card .investment-profit {
      color: #00e676;
      font-weight: 700;
    }

    .investment-card .investment-status {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid rgba(37, 184, 255, 0.18);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .investment-card .status-paid {
      color: #25b8ff;
    }

    .investment-card .status-active {
      color: #00e676;
    }

    .toast-container {
      position: fixed;
      bottom: 84px;
      right: 16px;
      left: 16px;
      max-width: 572px;
      margin: 0 auto;
      z-index: 900;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      pointer-events: none;
    }

    .toast-popup {
      background: rgba(9, 22, 42, 0.94);
      backdrop-filter: blur(10px);
      color: #ffffff;
      border-left: 4px solid #00e676;
      border-top: 1px solid rgba(37, 184, 255, 0.3);
      border-right: 1px solid rgba(37, 184, 255, 0.3);
      border-bottom: 1px solid rgba(37, 184, 255, 0.3);
      padding: 10px 14px;
      border-radius: 10px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.45);
      font-size: 12.5px;
      animation: popupSlide 0.35s ease-out forwards;
    }

    .toast-popup strong {
      color: #00e676;
    }

    @keyframes popupSlide {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeOut {
      to { opacity: 0; transform: translateY(-8px); }
    }
  </style>
</head>

  <script>
    function formatMoney(amount) {
      const number = Number(amount) || 0;
      return "UGX " + number.toLocaleString("en-US");
    }

    function switchTab(type) {
      const aiButton = document.getElementById("btn-ai");
      const cryptoButton = document.getElementById("btn-crypto");

      if (aiButton) aiButton.classList.toggle("active", type === "ai");
      if (cryptoButton) cryptoButton.classList.toggle("active", type === "crypto");

      if (typeof window.filterInvestmentCards === "function") {
        window.filterInvestmentCards(type);
      }
    }

    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById("btn-ai")?.addEventListener("click", () => switchTab("ai"));
      document.getElementById("btn-crypto")?.addEventListener("click", () => switchTab("crypto"));
    });

    const ugPrefixes = ["077", "078", "076", "075", "070", "074"];

    function getRandomUgPhone() {
      const prefix = ugPrefixes[Math.floor(Math.random() * ugPrefixes.length)];
      const randomSuffix = Math.floor(100 + Math.random() * 900);
      return `${prefix}****${randomSuffix}`;
    }

    function getRandomAmount() {
      const amount = Math.floor(Math.random() * (200000 - 15000 + 1) + 15000);
      const rounded = Math.round(amount / 5000) * 5000;
      return formatMoney(rounded);
    }

    function triggerWithdrawalPopup() {
      const toastContainer = document.getElementById("toast-container");
      if (!toastContainer) return;

      const toast = document.createElement("div");
      toast.className = "toast-popup";
      toast.innerHTML = `<span>💸 User <strong>${getRandomUgPhone()}</strong> withdrew <strong>${getRandomAmount()}</strong></span>`;
      toastContainer.appendChild(toast);

      setTimeout(function () {
        toast.style.animation = "fadeOut 0.4s ease-out forwards";
        setTimeout(() => toast.remove(), 400);
      }, 3500);
    }

    document.addEventListener("DOMContentLoaded", function () {
      setInterval(triggerWithdrawalPopup, 5000);
    });
  </script>
