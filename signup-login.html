<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="google" content="notranslate">
  <meta name="theme-color" content="#030917">
  <title>AIVI AI — Account Portal</title>
  <link rel="icon" type="image/png" href="assets/aivi-logo.png">
  <link href="wave-background.css" rel="stylesheet">
  <style>
    .portal-wrap {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    .portal-card {
      background: rgba(9, 21, 40, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 20px;
      border: 1px solid rgba(37, 184, 255, 0.45);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), 0 0 28px rgba(0, 150, 255, 0.16);
      color: #f0f7ff;
      width: 100%;
      max-width: 410px;
      padding: 30px 26px;
    }

    .portal-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 22px;
    }

    .portal-brand img {
      width: 58px;
      height: 58px;
      border-radius: 15px;
      margin-bottom: 12px;
      border: 1px solid rgba(37, 184, 255, 0.55);
      box-shadow: 0 0 20px rgba(37, 184, 255, 0.32);
    }

    .portal-brand h1 {
      font-size: 22px;
      font-weight: 800;
      margin: 0 0 4px;
      color: #ffffff;
    }

    .portal-brand p.sub {
      font-size: 13px;
      color: #9bb3cf;
      margin: 0;
    }

    .tabs {
      display: flex;
      gap: 6px;
      background: rgba(3, 10, 22, 0.72);
      border: 1px solid rgba(37, 184, 255, 0.24);
      border-radius: 12px;
      padding: 5px;
      margin-bottom: 22px;
    }

    .tabs button {
      flex: 1;
      border: 0;
      background: transparent;
      padding: 10px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      color: #8fa6c2;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tabs button.active {
      background: linear-gradient(135deg, #25b8ff 0%, #1685ff 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(22, 133, 255, 0.35);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    label {
      font-size: 13px;
      font-weight: 700;
      color: #dcebff;
    }

    input {
      width: 100%;
      background: rgba(3, 10, 22, 0.78);
      color: #ffffff;
      border: 1px solid rgba(37, 184, 255, 0.30);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    input::placeholder {
      color: #6e88a6;
    }

    input:focus {
      border-color: #25b8ff;
      box-shadow: 0 0 0 3px rgba(37, 184, 255, 0.16);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .captcha {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(3, 10, 22, 0.65);
      border: 1px solid rgba(37, 184, 255, 0.26);
      border-radius: 10px;
      padding: 8px 10px;
    }

    .captcha .code {
      font-family: monospace;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #00e676;
      background: rgba(0, 230, 118, 0.10);
      border: 1px solid rgba(0, 230, 118, 0.32);
      padding: 7px 11px;
      border-radius: 8px;
      user-select: none;
    }

    .captcha input {
      flex: 1;
      min-width: 0;
      padding: 9px 11px;
    }

    .captcha .refresh {
      border: 1px solid rgba(37, 184, 255, 0.28);
      background: rgba(37, 184, 255, 0.10);
      border-radius: 8px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      font-size: 17px;
      color: #25b8ff;
    }

    .btn {
      background: linear-gradient(90deg, #25b8ff 0%, #1685ff 100%);
      color: #ffffff;
      border: 0;
      border-radius: 11px;
      padding: 13px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(22, 133, 255, 0.35);
    }

    .forgot {
      font-size: 12.5px;
      color: #25b8ff;
      text-align: right;
      text-decoration: none;
    }

    .msg {
      font-size: 13px;
      font-weight: 600;
      text-align: center;
    }

    .msg.ok { color: #00e676; }
    .msg.err { color: #ff6b6b; }

    .switch {
      font-size: 13px;
      color: #9bb3cf;
      text-align: center;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(37, 184, 255, 0.16);
    }

    .switch a {
      color: #25b8ff;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <noscript><strong>Please enable JavaScript to continue.</strong></noscript>
  <div class="waves"></div>

  <div class="portal-wrap">
    <div class="portal-card">
      <div class="portal-brand">
        <img src="assets/aivi-logo.png" alt="AIVI AI Logo">
        <h1>Welcome to AIVI AI</h1>
        <p class="sub">Create an account or sign in.</p>
      </div>

      <div class="tabs">
        <button id="tabSignup" class="active" type="button">Sign Up</button>
        <button id="tabLogin" type="button">Log In</button>
      </div>

      <!-- SIGNUP -->
      <form id="signupForm">
        <div class="field">
          <label for="sName">Full Name</label>
          <input type="text" id="sName" placeholder="Your full name" required>
        </div>
        <div class="field">
          <label for="sEmail">Email Address</label>
          <input type="email" id="sEmail" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="sPass">Password</label>
          <input type="password" id="sPass" placeholder="Minimum 6 characters" required>
        </div>
        <div class="field">
          <label for="sCaptcha">Security Verification</label>
          <div class="captcha">
            <span class="code" id="sCode"></span>
            <input type="text" id="sCaptcha" placeholder="Enter code" required>
            <button type="button" class="refresh" title="New code" onclick="newCode('sCode')">↻</button>
          </div>
        </div>
        <button class="btn" type="submit">Sign Up</button>
        <div class="msg" id="sMsg"></div>
      </form>

      <!-- LOGIN -->
      <form id="loginForm" class="hidden">
        <div class="field">
          <label for="lEmail">Email Address</label>
          <input type="email" id="lEmail" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="lPass">Password</label>
          <input type="password" id="lPass" placeholder="Your password" required>
        </div>
        <div class="field">
          <label for="lCaptcha">Security Verification</label>
          <div class="captcha">
            <span class="code" id="lCode"></span>
            <input type="text" id="lCaptcha" placeholder="Enter code" required>
            <button type="button" class="refresh" title="New code" onclick="newCode('lCode')">↻</button>
          </div>
        </div>
        <button class="btn" type="submit">Log In</button>
        <a class="forgot" href="mailto:investinginai.online@gmail.com">Forgot password?</a>
        <div class="msg" id="lMsg"></div>
      </form>

      <div class="switch" id="switchText">
        Already have an account? <a id="toLogin">Log in</a>
      </div>
    </div>
  </div>

  <script>
    function newCode(id) {
      document.getElementById(id).textContent =
        Math.random().toString(36).slice(2, 7).toUpperCase();
    }
    newCode("sCode");
    newCode("lCode");

    const tabSignup = document.getElementById("tabSignup");
    const tabLogin = document.getElementById("tabLogin");
    const signupForm = document.getElementById("signupForm");
    const loginForm = document.getElementById("loginForm");
    const switchText = document.getElementById("switchText");

    function showSignup() {
      signupForm.classList.remove("hidden");
      loginForm.classList.add("hidden");
      tabSignup.classList.add("active");
      tabLogin.classList.remove("active");
      switchText.innerHTML = 'Already have an account? <a id="toLogin">Log in</a>';
      document.getElementById("toLogin").onclick = showLogin;
    }

    function showLogin() {
      loginForm.classList.remove("hidden");
      signupForm.classList.add("hidden");
      tabLogin.classList.add("active");
      tabSignup.classList.remove("active");
      switchText.innerHTML = 'Don\'t have an account? <a id="toSignup">Sign up</a>';
      document.getElementById("toSignup").onclick = showSignup;
    }

    tabSignup.onclick = showSignup;
    tabLogin.onclick = showLogin;
    document.getElementById("toLogin").onclick = showLogin;

    signupForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const msg = document.getElementById("sMsg");
      const code = document.getElementById("sCode").textContent;
      const input = document.getElementById("sCaptcha").value.trim().toUpperCase();
      if (input !== code) {
        msg.className = "msg err";
        msg.textContent = "Incorrect code. Please try again.";
        newCode("sCode");
        document.getElementById("sCaptcha").value = "";
        return;
      }
      msg.className = "msg ok";
      msg.textContent = "Account created successfully!";
      signupForm.reset();
      newCode("sCode");
    });

    loginForm.addEventListener("submit", (e) => {
      e.preventDefault();
      const msg = document.getElementById("lMsg");
      const code = document.getElementById("lCode").textContent;
      const input = document.getElementById("lCaptcha").value.trim().toUpperCase();
      if (input !== code) {
        msg.className = "msg err";
        msg.textContent = "Incorrect code. Please try again.";
        newCode("lCode");
        document.getElementById("lCaptcha").value = "";
        return;
      }
      msg.className = "msg ok";
      msg.textContent = "Logged in successfully!";
      loginForm.reset();
      newCode("lCode");
    });
  </script>
  <script src="wave-background.js"></script>
</body>
</html>
