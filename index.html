<!DOCTYPE html>
<html lang="en-us">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="google" content="notranslate">
  <meta name="theme-color" content="#030917">
  <title>AIVI AI — Sign Up &amp; Log In</title>
  <link rel="icon" type="image/png" href="assets/aivi-logo.png">
  <link href="wave-background.css" rel="stylesheet">
  <style>
    #authPage,
    #authPage * {
      box-sizing: border-box;
    }

    #authPage {
      position: relative;
      z-index: 1;
      min-height: 100dvh;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    #authPage .auth-card {
      background: rgba(9, 21, 40, 0.82);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      width: 100%;
      max-width: 410px;
      border-radius: 20px;
      border: 1px solid rgba(37, 184, 255, 0.45);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55), 0 0 28px rgba(0, 150, 255, 0.16);
      padding: 30px 26px;
      color: #f0f7ff;
    }

    #authPage .auth-brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 22px;
    }

    #authPage .auth-brand img {
      width: 58px;
      height: 58px;
      border-radius: 15px;
      margin-bottom: 12px;
      border: 1px solid rgba(37, 184, 255, 0.55);
      box-shadow: 0 0 20px rgba(37, 184, 255, 0.32);
    }

    #authPage h1.auth-title {
      font-size: 22px;
      font-weight: 800;
      color: #ffffff;
      margin: 0 0 4px;
    }

    #authPage p.auth-sub {
      font-size: 13px;
      color: #9bb3cf;
      margin: 0;
    }

    #authPage .auth-tabs {
      display: flex;
      gap: 6px;
      background: rgba(3, 10, 22, 0.72);
      border: 1px solid rgba(37, 184, 255, 0.24);
      border-radius: 12px;
      padding: 5px;
      margin-bottom: 22px;
    }

    #authPage .auth-tabs button {
      flex: 1;
      border: 0;
      background: transparent;
      padding: 10px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      color: #8fa6c2;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    #authPage .auth-tabs button.auth-active {
      background: linear-gradient(135deg, #25b8ff 0%, #1685ff 100%);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(22, 133, 255, 0.35);
    }

    #authPage form.auth-form {
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    #authPage .auth-form label {
      font-size: 13px;
      font-weight: 700;
      color: #dcebff;
    }

    #authPage .auth-form input {
      width: 100%;
      background: rgba(3, 10, 22, 0.78);
      color: #ffffff;
      border: 1px solid rgba(37, 184, 255, 0.30);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    #authPage .auth-form input::placeholder {
      color: #6e88a6;
    }

    #authPage .auth-form input:focus {
      border-color: #25b8ff;
      box-shadow: 0 0 0 3px rgba(37, 184, 255, 0.16);
    }

    #authPage .auth-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    #authPage .auth-captcha {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(3, 10, 22, 0.65);
      border: 1px solid rgba(37, 184, 255, 0.26);
      border-radius: 10px;
      padding: 8px 10px;
    }

    #authPage .auth-captcha .auth-code {
      font-family: monospace;
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 3px;
      color: #00e676;
      background: rgba(0, 230, 118, 0.10);
      border: 1px solid rgba(0, 230, 118, 0.32);
      padding: 7px 11px;
      border-radius: 8px;
      user-select: none;
      flex-shrink: 0;
    }

    #authPage .auth-captcha input {
      flex: 1;
      min-width: 0;
      padding: 9px 11px;
    }

    #authPage .auth-captcha .auth-refresh {
      border: 1px solid rgba(37, 184, 255, 0.28);
      background: rgba(37, 184, 255, 0.10);
      border-radius: 8px;
      width: 34px;
      height: 34px;
      cursor: pointer;
      font-size: 17px;
      color: #25b8ff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: none;
      transition: background 0.2s ease;
    }

    #authPage .auth-captcha .auth-refresh:hover {
      background: rgba(37, 184, 255, 0.22);
    }

    #authPage .auth-btn {
      background: linear-gradient(90deg, #25b8ff 0%, #1685ff 100%);
      color: #ffffff;
      border: 0;
      border-radius: 11px;
      padding: 13px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(22, 133, 255, 0.35);
      transition: transform 0.18s ease, filter 0.18s ease;
      margin-top: 4px;
    }

    #authPage .auth-btn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    #authPage .auth-forgot {
      font-size: 12.5px;
      color: #25b8ff;
      text-align: right;
      text-decoration: none;
      margin-top: -4px;
    }

    #authPage .auth-forgot:hover {
      text-decoration: underline;
    }

    #authPage .auth-msg {
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      min-height: 18px;
    }

    #authPage .auth-msg.auth-ok {
      color: #00e676;
    }

    #authPage .auth-msg.auth-err {
      color: #ff6b6b;
    }

    #authPage .auth-switch {
      font-size: 13px;
      color: #9bb3cf;
      text-align: center;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid rgba(37, 184, 255, 0.16);
    }

    #authPage .auth-switch a {
      color: #25b8ff;
      text-decoration: none;
      font-weight: 700;
      cursor: pointer;
    }

    #authPage .auth-hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <noscript><strong>Please enable JavaScript to continue.</strong></noscript>
  <div class="waves"></div>

  <div id="authPage">
    <div class="auth-card">
      <div class="auth-brand">
        <img src="assets/aivi-logo.png" alt="AIVI AI Logo">
        <h1 class="auth-title">Welcome to AIVI AI</h1>
        <p class="auth-sub">Create an investment account or sign in to continue.</p>
      </div>

      <div class="auth-tabs">
        <button id="authTabSignup" class="auth-active" type="button">Sign Up</button>
        <button id="authTabLogin" type="button">Log In</button>
      </div>

      <!-- SIGNUP -->
      <form id="authSignupForm" class="auth-form">
        <div class="auth-field">
          <label for="authSName">Phone Number</label>
          <input type="text" id="authSName" placeholder="Enter your phone number (e.g. 0771...)" required>
        </div>

        <div class="auth-field">
          <label for="authSpass">Password</label>
          <input type="password" id="authSpass" placeholder="Create a strong password" required>
        </div>

        <div class="auth-field">
          <label for="authSPass">Confirm Password</label>
          <input type="password" id="authSPass" placeholder="Retype your password" required>
        </div>

        <div class="auth-field">
          <label for="authSCaptcha">Security Verification</label>
          <div class="auth-captcha">
            <span class="auth-code" id="authSCode"></span>
            <input type="text" id="authSCaptcha" placeholder="Enter code" required>
            <button type="button" class="auth-refresh" title="New code" onclick="authNewCode('authSCode')">↻</button>
          </div>
        </div>

        <button class="auth-btn" type="submit">Create Account</button>
        <div class="auth-msg" id="authSMsg"></div>
      </form>

      <!-- LOGIN -->
      <form id="authLoginForm" class="auth-form auth-hidden">
        <div class="auth-field">
          <label for="authLEmail">Phone Number</label>
          <input type="text" id="authLEmail" placeholder="Enter your phone number" required>
        </div>

        <div class="auth-field">
          <label for="authLPass">Password</label>
          <input type="password" id="authLPass" placeholder="Enter your password" required>
        </div>

        <div class="auth-field">
          <label for="authLCaptcha">Security Verification</label>
          <div class="auth-captcha">
            <span class="auth-code" id="authLCode"></span>
            <input type="text" id="authLCaptcha" placeholder="Enter code" required>
            <button type="button" class="auth-refresh" title="New code" onclick="authNewCode('authLCode')">↻</button>
          </div>
        </div>

        <button class="auth-btn" type="submit">Log In</button>

        <a class="auth-forgot" href="mailto:investinginai.online@gmail.com?subject=Password%20Reset%20Assistance">
          Forgot password?
        </a>

        <div class="auth-msg" id="authLMsg"></div>
      </form>

      <div class="auth-switch" id="authSwitchText">
        Already have an account? <a id="authToLogin">Log in</a>
      </div>
    </div>
  </div>

  <script type="module" src="authication.js"></script>
  <script src="wave-background.js"></script>
</body>
</html>
